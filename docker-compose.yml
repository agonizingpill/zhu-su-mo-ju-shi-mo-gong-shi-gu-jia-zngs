name: ${COMPOSE_PROJECT_NAME:-mould-hours}
x-app: &app
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://mould:mould-local@db:5432/mould
    REDIS_URL: redis://redis:6379/0
    JWT_SECRET: ${JWT_SECRET:-local-mould-demo-change-me}
    SEED_DEMO: ${SEED_DEMO:-true}
    OPENBLAS_NUM_THREADS: 1
  volumes: [artifacts:/artifacts]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mould-hours}-db
    environment: {POSTGRES_USER: mould, POSTGRES_PASSWORD: mould-local, POSTGRES_DB: mould}
    ports: ['${DB_PORT:-17722}:5432']
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U mould -d mould'], interval: 3s, timeout: 3s, retries: 30}
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-mould-hours}-redis
    command: redis-server --appendonly yes
    volumes: [redis-data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 3s, timeout: 3s, retries: 20}
  backend:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-mould-hours}-backend
    ports: ['${BACKEND_PORT:-19222}:8000']
    healthcheck: {test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'], interval: 3s, timeout: 5s, retries: 40}
  worker:
    <<: *app
    container_name: ${COMPOSE_PROJECT_NAME:-mould-hours}-worker
    command: python -m src.worker
    healthcheck: {test: [CMD, python, -c, 'import os,time; assert time.time()-os.stat("/tmp/worker-heartbeat").st_mtime<20'], interval: 3s, timeout: 3s, retries: 40}
  frontend:
    build: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-mould-hours}-frontend
    ports: ['${FRONTEND_PORT:-18222}:80']
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, 'wget -qO- http://127.0.0.1/health'], interval: 3s, timeout: 3s, retries: 20}
volumes:
  db-data:
  redis-data:
  artifacts:
networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-10.221.23.0/24}
